<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Chat — LacesOS</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at top left,#e8edff,#f6f7fb 50%,#edf8f2);margin:0;display:flex;flex-direction:column;height:100dvh;color:#30343b}
#topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;background:#ffffffd9;border-bottom:1px solid #dfe3eb;backdrop-filter:blur(14px)}#brand{font-weight:750;font-size:1.05rem;letter-spacing:-.025em}button{font:inherit;cursor:pointer}#access-toggle{border:1px solid #d4d9e4;background:#fff;border-radius:13px;padding:8px 12px;color:#343b49}#access{display:none;background:#fff;padding:13px 18px;border-bottom:1px solid #e1e4eb;gap:9px;align-items:center;flex-wrap:wrap}#access.open{display:flex}#access-status{font-size:.9rem;color:#535d6c;flex:1;min-width:220px}#refresh{border:0;border-radius:10px;padding:9px 13px;background:#263bce;color:white}#refresh:disabled{opacity:.55;cursor:wait}
#chat{flex:1;padding:20px;max-width:850px;width:100%;margin:0 auto;overflow-y:auto;display:flex;flex-direction:column}#notice{background:#ffffffbd;color:#536071;border:1px solid #dfe5ef;padding:13px 16px;border-radius:13px;margin-bottom:18px;font-size:.94em;line-height:1.5}.message{margin:9px 0;padding:12px 16px;border-radius:18px;max-width:88%;overflow-wrap:anywhere;animation:fadeIn .2s ease;line-height:1.55;box-shadow:0 2px 9px #1725540a}.user{align-self:flex-end;background:#dbeafe;color:#183c78;border-bottom-right-radius:6px}.bot{align-self:flex-start;background:#fff;color:#243047;border:1px solid #e1e6ef;border-bottom-left-radius:6px}.error{align-self:center;max-width:100%;background:#fff0f0;color:#8a1c1c;border:1px solid #e8baba}.message p:first-child{margin-top:0}.message p:last-child{margin-bottom:0}pre{padding:12px;border-radius:10px;overflow-x:auto;background:#20242a;color:#f4f4f4;font-family:ui-monospace,monospace}code{overflow-wrap:anywhere}pre code{white-space:pre;overflow-wrap:normal}a{color:#0056b3}.message table{border-collapse:collapse;display:block;overflow-x:auto}.message th,.message td{border:1px solid #b9c2cc;padding:6px 9px}blockquote{border-left:3px solid #94a3b8;margin-left:0;padding-left:12px;color:#526070}
#quota{font-size:.8rem;color:#626c7a;padding:7px 18px;background:#ffffffb8;text-align:center;border-top:1px solid #e5e8ef}#form{display:flex;gap:10px;padding:15px;border-top:1px solid #dfe3eb;background:#ffffffd9;backdrop-filter:blur(12px)}#input{flex:1;min-width:0;padding:12px 16px;font-size:1em;border:1px solid #d5dbe6;border-radius:17px;outline:none;background:#fff}#input:focus{border-color:#7585f4;box-shadow:0 0 0 3px #7585f426}#send{padding:12px 20px;background:#3448d3;color:white;border:0;border-radius:15px}#send:disabled{opacity:.5;cursor:not-allowed}@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}@media(max-width:520px){#chat{padding:12px}.message{max-width:96%}#form{padding:10px}#send{padding:12px 16px}#access{padding:12px}}

/* Rich response rendering: content can grow without a fixed-height clip. */
.message{min-width:0;max-width:min(94%,100%);overflow:visible}
.bot{line-height:1.65}
.bot h1,.bot h2,.bot h3,.bot h4{line-height:1.25;margin:1.15em 0 .55em;color:inherit}
.bot h1{font-size:1.55em}.bot h2{font-size:1.32em}.bot h3{font-size:1.12em}
.bot ul,.bot ol{padding-left:1.6em}.bot li+li{margin-top:.25em}
.bot hr{border:0;border-top:1px solid #aab3c255;margin:1.2em 0}
.bot a{overflow-wrap:anywhere}
.bot pre{position:relative;max-width:100%;max-height:none;overflow:auto;white-space:pre;margin:1em 0;padding:42px 14px 14px;background:#171a21;border:1px solid #353b48;color:#f3f4f6;tab-size:2;line-height:1.5}
.bot pre code{display:block;white-space:pre;overflow-wrap:normal;word-break:normal;font-size:.9em;min-width:max-content}
.code-toolbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 9px;background:#252a34;border-bottom:1px solid #3b4250;border-radius:9px 9px 0 0;font-size:12px;color:#cbd5e1}
.code-toolbar button{border:1px solid #566071;background:#343b48;color:#fff;border-radius:7px;padding:4px 9px;font-size:12px}
.code-toolbar button:hover{background:#475164}
.bot :not(pre)>code{background:#e8ebf2;color:#293247;border-radius:5px;padding:2px 5px;font-size:.9em}
.bot table{border-collapse:collapse;display:block;max-width:100%;overflow:auto;margin:1em 0}
.bot th,.bot td{border:1px solid #aeb8c688;padding:7px 10px;text-align:left;vertical-align:top;min-width:65px}
.bot th{background:#64748b18;font-weight:700}
.bot blockquote{border-left:3px solid #7c8ce8;margin:1em 0;padding:.2em 0 .2em 14px;color:inherit;opacity:.9}
.bot img{max-width:100%;height:auto;border-radius:8px}
.bot .chart-wrap{position:relative;width:100%;min-height:260px;height:320px;margin:1em 0;padding:12px;border:1px solid #cbd5e166;border-radius:12px;background:#fff}
.bot .chart-error{color:#9b1c1c;background:#fff0f0;border:1px solid #f2c2c2;border-radius:8px;padding:10px;white-space:pre-wrap}
.bot .render-note{font-size:.82em;opacity:.75;margin-top:6px}
@media(max-width:520px){.message{max-width:100%}.bot pre{font-size:.82em;padding-top:40px}.bot .chart-wrap{height:260px;padding:6px}}
</style>
<script>window.MathJax={loader:{load:['[tex]/cancel','[tex]/mhchem','[tex]/mathtools','[tex]/upgreek']},tex:{inlineMath:[['\\(','\\)'],['$','$']],displayMath:[['\\[','\\]'],['$$','$$']],processEscapes:true,packages:{'[+]':['cancel','mhchem','mathtools','upgreek']},macros:{infin:'\\infty',infinity:'\\infty'}},options:{skipHtmlTags:['script','noscript','style','textarea','pre','code']},startup:{typeset:false}};</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
</head>
<body>
<header id="topbar"><div id="brand">LacesOS <span style="color:#7b8494;font-weight:500">· AI</span></div><button id="access-toggle" type="button">Access status</button></header>
<section id="access" aria-label="AI access status"><div id="access-status" role="status">Checking access…</div><button id="refresh" type="button">Check again</button></section>
<div id="chat"><div id="notice"><strong>Welcome to AI.</strong> Ask questions, brainstorm, or get help with schoolwork. Markdown, math, syntax-highlighted code, and charts are supported. Access and daily usage are checked by LacesOS.</div></div>
<div id="quota">Checking AI access…</div>
<form id="form"><input id="input" autocomplete="off" placeholder="Ask something…" aria-label="Message" disabled><button id="send" type="submit" disabled>Send</button></form>
<script>
(() => {
  'use strict';
  const SUPABASE_URL='https://exsvwwxomovjstlhgjjy.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY='sb_publishable_UWbW4pD0R5et-sbuiAAcbw_ORYuwTPB';
  const EDGE_URL=SUPABASE_URL+'/functions/v1/ai-gateway';
  const PROJECT_SCOPE=btoa(SUPABASE_URL).replace(/[^a-zA-Z0-9]/g,'').slice(-18);
  const DEVICE_KEY='lacesos_device_id_v1:'+PROJECT_SCOPE;
  const USERNAME_KEY='lacesos_username_v1:'+PROJECT_SCOPE;
  const chat=document.getElementById('chat'), form=document.getElementById('form'), input=document.getElementById('input'), send=document.getElementById('send');
  const access=document.getElementById('access'), accessStatus=document.getElementById('access-status'), quota=document.getElementById('quota'), refreshButton=document.getElementById('refresh');
  let history=[], deviceId='', username='', dailyLimit=0, usedToday=0, allowed=false, checking=false;
  try { deviceId=localStorage.getItem(DEVICE_KEY)||''; username=localStorage.getItem(USERNAME_KEY)||''; } catch (_) {}
  document.getElementById('access-toggle').addEventListener('click',()=>access.classList.toggle('open'));

  async function api(action, extra={}) {
    const response=await fetch(EDGE_URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_PUBLISHABLE_KEY,'Authorization':'Bearer '+SUPABASE_PUBLISHABLE_KEY},body:JSON.stringify({action,device_id:deviceId,username,...extra})});
    const data=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(data.error||('Request failed ('+response.status+').'));
    return data;
  }
  function isFenceClosed(text){
    const fences=(String(text).match(/^\s*```/gm)||[]).length;
    return fences % 2 === 0;
  }
  function isLikelyCutOff(text){
    const t=String(text).trimEnd();
    if(!t)return true;
    if(!isFenceClosed(t))return true;
    // Common endings when a model hits its output token ceiling mid-code.
    if(/(?:\bfunction|=>|[,{:=]\s*)$/.test(t))return true;
    const blocks=[...t.matchAll(/```[^\n]*\n([\s\S]*?)```/g)];
    if(blocks.length){
      const last=blocks[blocks.length-1][1].trimEnd();
      if(/(?:\b(?:const|let|var|return|if|else|for|while|class|def|import|export|try|catch)\s*|[=,{(.:]\s*)$/.test(last))return true;
    }
    return false;
  }
  function renderCharts(root){
    if(!window.Chart)return;
    root.querySelectorAll('pre code.language-chart, pre code.language-graph, pre code.language-plot, pre code.language-chartjs').forEach(code=>{
      const pre=code.parentElement, wrap=document.createElement('div');wrap.className='chart-wrap';
      try{
        const spec=JSON.parse(code.textContent);
        const canvas=document.createElement('canvas');canvas.setAttribute('aria-label',spec.title||'AI generated chart');canvas.setAttribute('role','img');wrap.appendChild(canvas);
        pre.replaceWith(wrap);
        const config=spec.config||spec;
        if(!config.type||!config.data)throw new Error('Chart JSON needs a type and data object.');
        config.options=config.options||{};config.options.responsive=true;config.options.maintainAspectRatio=false;
        new Chart(canvas,config);
      }catch(err){wrap.className='chart-error';wrap.textContent='Could not render this chart: '+err.message+'\nUse a fenced ```chart block with valid Chart.js JSON.';pre.replaceWith(wrap);}
    });
  }
  function enhanceCode(root){
    root.querySelectorAll('pre').forEach(pre=>{
      const code=pre.querySelector('code');if(!code)return;
      if(window.hljs){try{hljs.highlightElement(code)}catch(_){}}
      if(pre.querySelector('.code-toolbar'))return;
      const langClass=[...code.classList].find(c=>c.startsWith('language-'));
      const label=(langClass?langClass.slice(9):'code')||'code';
      const bar=document.createElement('div');bar.className='code-toolbar';
      const lang=document.createElement('span');lang.textContent=label;
      const copy=document.createElement('button');copy.type='button';copy.textContent='Copy code';
      copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(code.textContent);copy.textContent='Copied!';}catch(_){const range=document.createRange();range.selectNodeContents(code);const selection=getSelection();selection.removeAllRanges();selection.addRange(range);copy.textContent='Select and copy';}setTimeout(()=>{copy.textContent='Copy code';},1600);});
      bar.append(lang,copy);pre.appendChild(bar);
    });
  }
  function typesetMath(root){
    if(!window.MathJax)return;
    const ready=window.MathJax.startup&&window.MathJax.startup.promise?window.MathJax.startup.promise:Promise.resolve();
    ready.then(()=>{if(typeof window.MathJax.typesetPromise==='function')return window.MathJax.typesetPromise([root]);}).catch(()=>{});
  }
  function escapeHTML(value){return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function renderMarkdownWithMath(text){
    // Keep TeX intact while Markdown is parsed (underscores, asterisks, etc. are common in formulas).
    const math=[];
    const protectedText=String(text).replace(/\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\)|(?<!\\)\$(?!\$)(?:\\.|[^$\n\\])+?(?<!\\)\$/g,match=>{
      const token='LACESOSMATHPLACEHOLDER'+math.length+'TOKEN';math.push(match);return token;
    });
    let html=marked.parse(protectedText,{breaks:true,gfm:true});
    if(window.DOMPurify)html=DOMPurify.sanitize(html,{USE_PROFILES:{html:true}});
    return html.replace(/LACESOSMATHPLACEHOLDER(\d+)TOKEN/g,(_,index)=>escapeHTML(math[Number(index)]));
  }
  function addMessage(role,text,isError=false){
    const div=document.createElement('div');div.className='message '+(isError?'error':role);
    if(!isError && role==='bot' && window.marked){
      div.innerHTML=renderMarkdownWithMath(String(text));
      renderCharts(div);enhanceCode(div);
      typesetMath(div);
    } else div.textContent=text;
    chat.appendChild(div);chat.scrollTop=chat.scrollHeight;return div;
  }
  function setChatEnabled(value){input.disabled=!value;send.disabled=!value;}
  async function refreshAccess(){
    if(checking)return;checking=true;refreshButton.disabled=true;refreshButton.textContent='Checking…';
    try{
      if(!deviceId){allowed=false;setChatEnabled(false);access.classList.add('open');accessStatus.textContent='No device ID found. Close this tab and open AI from inside LacesOS.';quota.textContent='Open AI from the LacesOS home screen.';return;}
      const result=await api('status');allowed=result.allowed===true;dailyLimit=Number(result.daily_limit||0);usedToday=Number(result.used||0);
      if(!allowed){setChatEnabled(false);access.classList.add('open');accessStatus.textContent='AI is not enabled for this device. The LacesOS owner can grant access in Supabase; no activation code is needed.';quota.textContent='AI access is currently disabled for this device.';return;}
      setChatEnabled(true);accessStatus.textContent='AI access is enabled for this device.';quota.textContent='Requests used today: '+usedToday+' / '+dailyLimit+' · resets at midnight UTC';
    }catch(error){allowed=false;setChatEnabled(false);access.classList.add('open');accessStatus.textContent='Could not check access: '+error.message;quota.textContent='AI access check failed. Check the connection and try again.';}
    finally{checking=false;refreshButton.disabled=false;refreshButton.textContent='Check again';}
  }
  refreshButton.addEventListener('click',refreshAccess);
  form.addEventListener('submit',async(event)=>{
    event.preventDefault();const prompt=input.value.trim();if(!prompt||send.disabled)return;
    addMessage('user',prompt);input.value='';setChatEnabled(false);send.textContent='Thinking…';const thinking=addMessage('bot','Thinking…');
    let answer='';
    const wantsGraph=/\b(graph|plot|chart|graphed|graphing|visuali[sz]e data)\b/i.test(prompt);
    const apiPrompt=wantsGraph?prompt+'\n\nFor this graph/chart request, render an actual chart whenever the request contains enough information. Include a fenced ```chart block containing valid Chart.js JSON with type and data.labels/data.datasets (use type line for trends/functions and scatter for x-y points). For a supplied equation/function, calculate plotted points across a sensible x-range and label axes; for supplied data, graph those values faithfully. If essential data is missing, ask for it instead of inventing it. Clearly label any illustrative/sample data. Keep the explanation outside the chart block.':prompt;
    try{
      const contents=[...history,{role:'user',parts:[{text:apiPrompt}]}];
      let result=await api('chat',{contents});answer=String(result.answer||'').trim();if(!answer)throw new Error('Gemini returned an empty response.');
      // The gateway has a per-response token ceiling. If the model stops inside a fenced
      // block (or at a typical mid-code boundary), ask it to continue and append the result.
      // Several passes allow large code answers to finish instead of silently ending at a fence.
      let passes=0;
      const hitOutputLimit=String(result.finishReason||result.finish_reason||'').toUpperCase().includes('MAX_TOKENS')||String(result.finishReason||result.finish_reason||'').toUpperCase().includes('LENGTH');
      while((isLikelyCutOff(answer)||(passes===0&&hitOutputLimit))&&passes<8){
        passes++;send.textContent='Finishing code… ('+passes+'/8)';
        const continuation=[...history,
          {role:'user',parts:[{text:apiPrompt}]},
          {role:'model',parts:[{text:answer}]},
          {role:'user',parts:[{text:'Continue exactly where your previous response stopped. Do not repeat any earlier text. Finish any incomplete code, statements, functions, arrays, objects, markdown tables, or fenced code blocks. Output only the continuation, and close every code fence. If the answer is already complete, reply with only [DONE].'}]}
        ];
        const more=await api('chat',{contents:continuation});
        let part=String(more.answer||'').trim();
        if(!part||part==='[DONE]')break;
        // Avoid common repeated-prefix continuation behavior.
        if(answer.endsWith(part)||part===answer)break;
        const overlapMax=Math.min(answer.length,part.length,2000);let overlap=0;
        for(let n=overlapMax;n>0;n--){if(answer.slice(-n)===part.slice(0,n)){overlap=n;break;}}
        answer+='\n'+part.slice(overlap);
        if(more.usage)result.usage=more.usage;
        if(isFenceClosed(answer)&&!isLikelyCutOff(answer))break;
      }
      thinking.remove();addMessage('bot',answer);
      history.push({role:'user',parts:[{text:apiPrompt}]},{role:'model',parts:[{text:answer}]});if(history.length>24)history=history.slice(-24);
      if(result.usage){usedToday=Number(result.usage.used||usedToday);dailyLimit=Number(result.usage.daily_limit||dailyLimit);quota.textContent='Requests used today: '+usedToday+' / '+dailyLimit+' · resets at midnight UTC';}
      if(passes>=8&&isLikelyCutOff(answer))addMessage('bot','This response may still be incomplete because the server reached its continuation limit. Ask “continue from the last line” to keep going.',true);
    }catch(error){thinking.remove();addMessage('bot',error.message||'Could not get a response. Please try again.',true);if(/not enabled|not registered|access/i.test(error.message||'')){allowed=false;access.classList.add('open');accessStatus.textContent=error.message;}}
    finally{setChatEnabled(allowed);send.textContent='Send';input.focus();}
  });
  refreshAccess();
})();
</script>
</body>
</html>
