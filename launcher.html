<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>BIOS</title>
</head>
<body>
<script>
(async () => {
  const SYSTEM_URL =
    "https://raw.githubusercontent.com/sashabolton0-ux/chat/main/system/system.html";

  try {
    const r = await fetch(SYSTEM_URL + "?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("System could not be loaded (" + r.status + ").");
    const html = await r.text();

    const win = window.open("about:blank", "BIOS-System");
    if (!win) throw new Error("Popup blocked. Allow popups for launcher.html.");

    win.document.open();
    win.document.write(html);
    win.document.close();
    window.close();
  } catch (e) {
    document.body.innerHTML =
      "<pre style='font:16px system-ui;padding:24px'>" +
      "BIOS could not start the System.\n\n" +
      String(e.message) +
      "</pre>";
  }
})();
</script>
</body>
</html>
